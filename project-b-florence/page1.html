<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CCLab Project</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&family=Edu+AU+VIC+WA+NT+Pre:wght@400..700&display=swap"

  <script src="lib/p5.js"></script>

  <div class="wrapper">
    <div class="whole-background">
      <!-- Title! -->
      <div class="title-box">
        <h1>Futuristic Garden</h1>
      </div>

      <div class="tree-image-container">
        <button
          onclick=" alert('You are choosing Spring: You are a Spring person! Maybe you want to try something Spring?') "><img

        <button
          onclick=" alert('You are choosing Summer: You are a Summer person! Maybe you want to try something Summer?') ">
          <img src="assets/tree2.png" class="align-tree-image" alt=""></button>
        <button
          onclick=" alert('You are choosing Autumn: You are an Autumn person! Maybe you want to try something Autumn?') ">

      </div>

      <div class="main-title-container">
        <div class="main-title-box">
          Once upon a time...
          You can personalize your tree!
        </div>
        <div class="main-link-box">
