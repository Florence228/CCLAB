<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CCLab Project</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&family=Edu+AU+VIC+WA+NT+Pre:wght@400..700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" type="text/css" href="css/style.css">

  <script src="lib/p5.js"></script>
  <script src="lib/p5.sound.js"></script>
</head>

<body>
  <audio autoplay loop>
    <source src="assets/bgm.mp3" type="audio/mpeg">
  </audio>
  <div class="wrapper">
    <div class="whole-background">
      <!-- Title! -->
      <div class="title-box">
        <h1>Futuristic Garden</h1>
      </div>

      <div class="tree-image-container">
        <button onclick="showTreeText1()">
          <img src="assets/tree1.jpeg" class="align-tree-image" alt=""></button>
        <button onclick="showTreeText2()">
          <img src="assets/tree2.png" class="align-tree-image" alt=""></button>
        <button onclick="showTreeText3()">
          <img src="assets/tree3.png" class="align-tree-image" alt=""></button>
        <button onclick="showTreeText4()">
          <img src="assets/tree4.jpg" class="align-tree-image" alt=""></button>
      </div>

      <div class="main-title-container">
        <div class="main-title-box">
          Once upon a time...
          You can personalize your tree!
        </div>
        <div class="main-link-box">
          <a href="page2.html">Explore...</a>
        </div>
      </div>
    </div>

    <div id="pop-up-text-box">
      <h2 id="pop-up-text"></h2>
    </div>
    <script src="js/page1.js"></script>
</body>

</html>
