<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CCLab Project</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&family=Edu+AU+VIC+WA+NT+Pre:wght@400..700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" type="text/css" href="css/style.css">

  <script src="lib/p5.js"></script>
  <script src="lib/p5.sound.js"></script>
</head>

<body>
  <audio autoplay>
    <source src="assets/bgm2.mp3" type="audio/mpeg">
  </audio>
  <div class="box-background">
    <div class="box-wrapper">

      <div id="box-back-link">
        <a href="page2.html">Go Back and choose again!</a>
      </div>
      <div id="end-page-link">
        <a href="summer.html">✨Now go and check it out!✨</a>
      </div>
      <div id="dead-page-link">
        <a href="dead.html">OOPS...Seems dead...😭</a>
      </div>

      <div class="column-container">
        <button class="column-button" onclick="applySeed()">
          <h1>Plant! 🪱</h1>
        </button>
        <button class="column-button" onclick="applyWater()">
          <h1>Water! 🐳</h1>
        </button>
        <button class="column-button" onclick="applySunshine()">
          <h1>Sunshine! ☀️</h1>
        </button>
        <button class="column-button" onclick="applyFertilizer()">
          <h1>Fertilizer! 🌽</h1>
        </button>
        <button class="column-button" onclick="applyStep()">
          <h1>Step on it! 🚶</h1>
        </button>
      </div>
      <!-- Title! -->
      <div class="page-title-box">
        <h2>Futuristic Garden</h2>
        <h3>Plant first. Do the middle three in sequence, hover over the plant, and do it again! "Water, Sunshine,
          Fertilizer,
          Water, Sunshine, Fertilizer!" 🫘</h3>
      </div>

      <div class="garden-box">
        <div id="p5-canvas-container"></div>
      </div>

    </div>


  </div>

  <script src="js/summer.js"></script>
</body>

</html>
